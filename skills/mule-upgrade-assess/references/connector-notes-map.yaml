# connector-notes-map.yaml — POM artifactId → release-notes URL (see 'description').
# Regenerate: node .agents/artifacts/build_notes_map.mjs && node .agents/artifacts/assemble_notes_map.mjs
# Curated (matrix) slugs are hand-verified; auto entries are best-effort enrichment.
schemaVersion: '1.0'
description: >-
  Maps a connector's POM artifactId to its MuleSoft release-notes URL, so the assessor fetches the correct per-connector
  OpenJDK/Mule-runtime compatibility table instead of guessing a slug. 'curated' entries are the matrix connectors with
  hand-verified slugs (authoritative); 'auto' entries are resolved from the docs index joined with an exact
  Exchange-Graph artifactId match.
generated: one-time from docs release-notes index + Exchange GraphQL (see .agents/artifacts/build_notes_map.mjs)
