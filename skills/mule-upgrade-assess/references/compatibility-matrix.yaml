# Java 17 upgrade rules - consumed by pf-assess-app. Versions are tunable without code changes.
#
# DELIVERY (see config.yaml -> matrix.source):
#   - This file is the bundled CLASSPATH copy - always packaged in the app and used as the
#     fallback if the Exchange fetch fails.
#   - In dev/prod the orchestrator fetches the CENTRALLY-GOVERNED copy from Anypoint Exchange
#     at runtime (cached matrix.refreshSeconds), so updating the matrix does NOT require
#     redeploying every instance - publish a new asset/version and instances pick it up.
#
# PUBLISH / UPDATE ON EXCHANGE (asset: <orgId>:java17-compatibility-matrix, packaging: yaml):
#   Using anypoint-cli-v4 (needs a Connected App with Exchange Contributor):
#     anypoint-cli-v4 exchange asset upload \
#       --organization "<orgId>" \
#       --name "Java 17 Compatibility Matrix" \
#       --classifier yaml --mainFile compatibility-matrix.yaml \
#       "<orgId>/java17-compatibility-matrix/1.0.0"
#   Bump the version (and config.yaml matrix.exchange.version) when publishing a new revision.
#   Keep this bundled copy in sync so the fallback stays accurate.
schemaVersion: "1.1"
target:
  runtime: "4.9.18"          # app.runtime AND app.runtime.semver
  javaVersion: "17"

# GATING - if installed < min, upgrade is REQUIRED (rule_1..rule_4)
# `property` is the primary (Maven property placeholder) key. Optional `groupId`/`artifactId`
# let the resolver also detect versions pinned INLINE on a <dependency>/<dependencyManagement>
# entry (no property); optional `pluginGroupId`/`pluginArtifactId` do the same for a
# <build><plugins>/<pluginManagement> <plugin> entry. Resolution order per rule is:
# property  ->  inline dependency version  ->  inline plugin version. Rules with no
# coordinates are property-only (e.g. runtime/java, which are never plain dependencies).
gating:
  muleRuntime:        { property: "app.runtime",                       min: "4.6.0", set: "4.9.18" }
  muleRuntimeSemver:  { property: "app.runtime.semver",                min: "4.6.0", set: "4.9.18" }
  javaVersion:        { property: "java.version",                      in: ["1.8","8","11"], set: "17" }
  javaCompilerSource: { property: "maven.compiler.source",             in: ["1.8","8","11"], set: "17" }
  javaCompilerTarget: { property: "maven.compiler.target",             in: ["1.8","8","11"], set: "17" }
  muleMavenPlugin:    { property: "mule.maven.plugin.version",         min: "4.1.0", set: "4.10.0", pluginGroupId: "org.mule.tools.maven",     pluginArtifactId: "mule-maven-plugin" }
  # MUnit 3.6.3+ is REQUIRED on Mule 4.9 / Java 17. Releases < 3.6.3 fail embedded-container
  # startup with "javax.naming is not open to module org.mule.runtime.jpms.utils" (fixed by
  # W-20335051). min is set to 3.6.3 so 3.6.1/3.6.2 are flagged and bumped, never left as-is.
  munit:              { property: "munit.version",                     min: "3.6.3", set: "3.6.3", groupId: "com.mulesoft.munit", artifactId: "munit-runner", pluginGroupId: "com.mulesoft.munit.tools", pluginArtifactId: "munit-maven-plugin" }
  munitExtPlugin:     { property: "munit.extensions.maven.plugin.version",min: "1.2.0", set: "1.5.0", pluginGroupId: "com.mulesoft.munit.tools", pluginArtifactId: "munit-extensions-maven-plugin" }
  weave:              { property: "weave.version",                     min: "1.2.0", set: "1.5.0", groupId: "org.mule.weave", artifactId: "assertions" }

# COMPATIBILITY - bump to 'set' if installed < 'set' (rule_5)
connectors:
  - { property: "apikit.version",                   set: "1.11.8", groupId: "org.mule.modules",    artifactId: "mule-apikit-module" }
  - { property: "http.connector.version",           set: "1.11.3", groupId: "org.mule.connectors", artifactId: "mule-http-connector" }
  - { property: "sockets.connector.version",        set: "1.2.8",  groupId: "org.mule.connectors", artifactId: "mule-sockets-connector" }
  - { property: "objectstore.connector.version",    set: "1.3.0",  groupId: "org.mule.connectors", artifactId: "mule-objectstore-connector" }
  - { property: "secure.conf.prop.module.version",  set: "1.2.7",  groupId: "com.mulesoft.modules", artifactId: "mule-secure-configuration-property-module" }
  - { property: "db.connector.version",             set: "1.14.6", groupId: "org.mule.connectors", artifactId: "mule-db-connector" }
  - { property: "validation.module.version",        set: "2.0.4",  groupId: "org.mule.modules",    artifactId: "mule-validation-module" }
  - { property: "json.module.version",              set: "2.5.2",  groupId: "org.mule.modules",    artifactId: "mule-json-module" }
  - { property: "xml.module.version",               set: "1.4.2",  groupId: "org.mule.modules",    artifactId: "mule-xml-module" }
  - { property: "oauth.module.version",             set: "1.1.24", groupId: "org.mule.modules",    artifactId: "mule-oauth-module" }
  - { property: "tracing.module.version",           set: "1.0.3",  groupId: "org.mule.modules",    artifactId: "mule-tracing-module" }
  # -- Third-party SaaS connectors (Java 17 versions per MuleSoft connector release notes /
  #    KB "Java 17-Compatible Anypoint Connectors", id=000782248). 'set' = a conservative,
  #    known-good Java-17 version WITHIN the connector's current major line. Notes:
  #      twilio 4.2.9 (Java 17 since 4.2.7); gmail 1.1.2 (latest); slack 1.0.17 (1.x, 2.x is a
  #      breaking major); salesforce 10.19.2 (10.x, 11.x is a newer major).
  - { property: "twilio.connector.version",         set: "4.2.9",  groupId: "com.mulesoft.connectors", artifactId: "mule-twilio-connector" }
  - { property: "gmail.connector.version",          set: "1.1.2",  groupId: "com.mulesoft.connectors", artifactId: "mule4-gmail-connector" }
  - { property: "slack.connector.version",          set: "1.0.17", groupId: "com.mulesoft.connectors", artifactId: "mule4-slack-connector" }
  - { property: "salesforce.connector.version",     set: "10.19.2", groupId: "com.mulesoft.connectors", artifactId: "mule-salesforce-connector" }

# NOTE: wsc/vm/sftp/file/email/mq are present in the BOM but unused by the demo app - add here if found.

# HYGIENE
removeJvmFlags: ["-XX:-UseBiasedLocking", "-M-XX:-UseBiasedLocking"]

# On Mule 4.9 / Java 17 the embedded MUnit container manages JPMS itself and REJECTS any
# boot-module-layer tweaks passed to the forked test JVM, failing with
# "Invalid module tweaking options passed to the JVM running the Mule Runtime".
# These argLine flags must be stripped from the munit-(maven|extensions) plugin <argLines>.
removeMunitJpmsFlags: ["--add-opens", "--add-exports", "--add-modules"]

# MANUAL-REVIEW FLAGS - never auto-fix; raise warnings (rule_7, rule_8)
manualReview:
  customJavaCode:   { scanGlobs: ["src/main/java/**/*.java"], warn: "Custom Java - reflection/SecurityManager restricted on 17" }
  javaPojoInDw:     { scanRegex: "as Object \\{ class:",        warn: "DataWeave Java POJO needs getters AND setters on 17" }
  apiPolicies:      { source: "apiManager",                 warn: "App has API Manager policies - re-validate after upgrade" }
  munitJpmsFlags:   { scanRegex: "add-(opens|exports|modules)", warn: "Remove add-opens/add-exports argLines from the MUnit plugin - rejected by the Mule 4.9 embedded container on Java 17" }

# mule-artifact.json target
muleArtifact: { minMuleVersion: "4.9.0", javaSpecificationVersions: ["17"] }
